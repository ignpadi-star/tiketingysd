<style>
/* ======================================================================
   TICKETING DESIGN SYSTEM - "Two-Sided Gatehouse"
   Publik: gelap, blok besar, energik. Admin: terang, padat, tenang.
   Semua warna komponen memakai token agar override Settings tetap hidup.
   ====================================================================== */

:root{
  --brand:#1d4ed8; --brand-accent:#f59e0b;
  --primary:var(--brand); --accent:var(--brand-accent);
  --brand-paint:var(--brand); --accent-paint:var(--brand-accent);
  --on-brand:#fff;
  --brand-hover:var(--primary-hover); --brand-hover-filter:none;
  --primary-hover:color-mix(in srgb,var(--primary),#111);
  --bg:#eef1f7; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#e8edf7;
  --card:var(--surface); --soft:var(--surface-2); --secondary-surface:var(--surface-3);
  --ink:#0b1220; --muted:#5b6b82; --line:#dfe5ef; --line-strong:#c3cddd;
  --input-bg:#ffffff; --input-border:#c3cddd;
  --row-alt:#f6f8fc;
  --ok:#15803d; --okbg:#dcfce7; --ok-ink:#14532d;
  --bad:#dc2626; --badbg:#fee2e2; --bad-ink:#7f1d1d;
  --warn:#b45309; --warnbg:#fef3c7; --warn-ink:#78350f;
  --info:#0369a1; --infobg:#e0f2fe; --info-ink:#075985;
  --chip-bg:#e8edf7; --chip-ink:#334155;
  --top-bg:#0b1220; --top-line:#1e293b;
  --toast-bg:#0b1220; --toast-ink:#ffffff;
  --radius:14px; --radius-sm:10px; --radius-xs:8px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -18px rgba(15,23,42,.18);
  --shadow-hover:0 2px 4px rgba(15,23,42,.05),0 20px 44px -22px rgba(15,23,42,.24);
  --ease:cubic-bezier(.2,.7,.3,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --font-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-display:"Bebas Neue","Source Sans 3",system-ui,sans-serif;
  --font-mono:ui-monospace,Menlo,Consolas,monospace;
  --link:var(--primary);
  --focus:var(--primary);
  --input-ring:color-mix(in srgb,var(--primary) 28%,transparent);
  --hero-ink:#eaf0ff;
}

/* Publik: kanvas malam, CTA biru terang, aksen amber. */
body.public-app{
  --brand:#2563eb; --primary:var(--brand);
  --primary-hover:color-mix(in srgb,var(--primary) 84%,#fff);
  color-scheme:dark;
  --bg:#020617; --surface:#0d1424; --surface-2:#111a2c; --surface-3:#1a2438;
  --card:var(--surface); --soft:var(--surface-2); --secondary-surface:var(--surface-3);
  --ink:#e6edf7; --muted:#94a3b8; --line:#243149; --line-strong:#334155;
  --input-bg:#0b1322; --input-border:#334155;
  --row-alt:#111a2c;
  --ok:#22c55e; --okbg:#052e16; --ok-ink:#86efac;
  --bad:#ef4444; --badbg:#450a0a; --bad-ink:#fca5a5;
  --warn:#f59e0b; --warnbg:#451a03; --warn-ink:#fcd34d;
  --info:#38bdf8; --infobg:#082f49; --info-ink:#7dd3fc;
  --chip-bg:#1e293b; --chip-ink:#cbd5e1;
  --top-bg:rgba(2,6,23,.96); --top-line:#1e293b;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 24px 48px -32px rgba(0,0,0,.9);
  --shadow-hover:0 1px 0 rgba(255,255,255,.05),0 32px 64px -30px rgba(0,0,0,.95);
  --link:color-mix(in srgb,var(--primary) 62%,#fff);
  --focus:var(--accent);
  --input-ring:color-mix(in srgb,var(--primary) 55%,transparent);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;caret-color:var(--link);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top,.foot{flex:0 0 auto}
main.wrap{flex:1 0 auto}
::selection{background:color-mix(in srgb,var(--primary) 42%,transparent);color:var(--ink)}
*{scrollbar-color:color-mix(in srgb,var(--muted) 45%,transparent) transparent;scrollbar-width:thin}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 38%,transparent);border:3px solid var(--bg);border-radius:999px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .55em;letter-spacing:-.015em;font-weight:700}
h1{font-size:clamp(1.72rem,1.4rem + 1.1vw,2.05rem);letter-spacing:-.03em}
h2{font-size:1.32rem}
h3{font-size:1.06rem}
h4{font-size:.95rem}
h1,h2{text-wrap:balance}
p{max-width:72ch}
a{color:var(--link);text-underline-offset:.18em;text-decoration-thickness:.08em}
.display{font-family:var(--font-display);font-weight:400;letter-spacing:.015em;line-height:.95}
.hidden{display:none!important}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 20px}
.admin-app .wrap{max-width:1440px}
main.wrap{padding-top:28px;padding-bottom:64px;min-height:40vh}
.admin-app main.wrap{padding-top:24px;padding-bottom:56px}
.muted{color:var(--muted)} .small{font-size:.85rem} .center{text-align:center} .right{text-align:right}
.mt{margin-top:14px} .mb{margin-bottom:14px} .gap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.pre{white-space:pre-wrap;word-break:break-word}
.lede{font-size:1rem;color:var(--muted);margin:-4px 0 24px;max-width:64ch;line-height:1.6}
.skip-link{position:absolute;top:-60px;left:0;background:var(--primary);color:#fff;padding:10px 18px;z-index:200;font-size:.9rem;text-decoration:none;border-radius:0 0 10px 0;font-weight:600}
.skip-link:focus{top:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- Header ---------- */
.top{background:var(--top-bg);color:#fff;position:sticky;top:0;z-index:40;border-bottom:1px solid var(--top-line)}
.public-app .top{box-shadow:0 10px 30px -24px rgba(0,0,0,.9);color:var(--top-ink,#fff)}
.public-app .brand{color:var(--top-ink,#fff)}
.public-app .nav button{color:color-mix(in srgb,var(--top-ink,#fff) 78%,transparent)}
.public-app .nav button:hover{background:color-mix(in srgb,var(--top-ink,#fff) 12%,transparent);color:var(--top-ink,#fff)}
.public-app .nav button.active{background:var(--top-ink,#fff);color:var(--top-bg)}
.public-app .util{color:var(--top-ink,#fff);border-color:color-mix(in srgb,var(--top-ink,#fff) 30%,transparent)}
.public-app .util:hover{background:color-mix(in srgb,var(--top-ink,#fff) 12%,transparent);border-color:color-mix(in srgb,var(--top-ink,#fff) 52%,transparent)}
.public-app .mode-tag{color:var(--area-muted,var(--muted));border-color:color-mix(in srgb,var(--top-ink,#fff) 28%,transparent)}

/* Teks di dalam permukaan (kartu, hero, modal) mengikuti warna area, bukan latar halaman. */
.public-app .card,
.public-app .home-hero,
.public-app .stat,
.public-app .event-pick,
.public-app .modal,
.public-app .tpick,
.public-app .checkout,
.public-app .peserta,
.public-app .online-panel,
.public-app .theme-preview,
.public-app .gate-res{--ink:var(--area-ink);--muted:var(--area-muted)}
.admin-app .top{box-shadow:none}
.topbar{display:flex;align-items:center;gap:10px 14px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:1.04rem;letter-spacing:-.01em;flex:1 1 auto;min-width:0}
.brand:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:10px}
.brand img{height:34px;width:auto;border-radius:8px;background:#fff;object-fit:contain}
.brand .brand-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent-paint,var(--accent));color:#1a1203;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;flex:0 0 auto;letter-spacing:0}
.admin-app .brand-mark{background:var(--primary);color:#fff}
.mode-tag{font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:4px 8px;flex:0 0 auto;color:#cbd5e1}
.top-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.util{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:transparent;color:#fff;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;transition:background .16s var(--ease),border-color .16s var(--ease)}
.util:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.46)}
.util:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.who{font-size:.8rem;opacity:.9;padding:0 8px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Widget sesi online (admin) */
.online-wrap{display:inline-flex;align-items:center;gap:6px;position:relative;flex:0 0 auto}
.online-pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:transparent;color:#fff;font:inherit;font-size:.78rem;font-weight:600;cursor:pointer;transition:background .16s var(--ease),border-color .16s var(--ease),transform .12s var(--ease);-webkit-tap-highlight-color:transparent}
.online-pill:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.46)}
.online-pill:active{transform:scale(.98)}
.online-pill:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.online-pill svg{flex:0 0 auto;opacity:.9}
.online-pill.accent{background:var(--accent);border-color:transparent;color:#1a1203}
.online-pill.accent:hover{background:color-mix(in srgb,var(--accent),#111)}
.online-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.22);flex:0 0 auto}
.online-count{font-variant-numeric:tabular-nums;white-space:nowrap}
.online-panel{position:absolute;top:calc(100% + 8px);right:0;width:330px;max-width:calc(100vw - 24px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px -18px rgba(0,0,0,.5);z-index:80;overflow:hidden;animation:pop-in .18s var(--ease-out)}
.online-head{padding:12px 16px;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
.online-item{padding:12px 16px;border-bottom:1px solid var(--line)}
.online-item:last-child{border-bottom:0}
.online-name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;line-height:1.3}
.online-name .chip{margin-left:auto}
.online-user{font-size:.78rem;color:var(--muted);margin-top:1px}
.online-device{font-size:.8rem;margin-top:6px}
.online-time{font-size:.74rem;color:var(--muted);margin-top:2px}
.online-empty{padding:16px;font-size:.85rem;color:var(--muted)}
@media(max-width:860px){
  .online-pill .online-label{display:none}
  .online-pill{padding:0 10px;font-size:.74rem}
}
@media(max-width:760px){
  .online-panel{position:fixed;top:68px;left:12px;right:12px;width:auto;max-width:none}
}

/* Navigasi */
.burger{display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:1.2rem;border-radius:8px;width:38px;height:36px;cursor:pointer;padding:0}
.burger:hover{background:rgba(255,255,255,.18)}
.public-app .burger{color:var(--top-ink,#fff);background:color-mix(in srgb,var(--top-ink,#fff) 10%,transparent);border-color:color-mix(in srgb,var(--top-ink,#fff) 22%,transparent)}
.public-app .burger:hover{background:color-mix(in srgb,var(--top-ink,#fff) 18%,transparent)}
.burger svg{display:block}
.burger .i-close{display:none}
.burger[aria-expanded=true] .i-open{display:none}
.burger[aria-expanded=true] .i-close{display:block}
.burger:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.nav{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.nav button{background:transparent;color:rgba(255,255,255,.82);border:0;padding:8px 13px;border-radius:999px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .16s var(--ease),color .16s var(--ease)}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.nav button.active{background:#fff;color:#020617;font-weight:700}
.admin-app .nav button{border-radius:8px}
.admin-app .nav button.active{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 -2px 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.navrow{display:flex;align-items:center;gap:8px;min-height:46px;border-top:1px solid var(--top-line)}
.navrow .nav{flex:1;min-width:0;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding:5px 0 7px}
.navrow .nav::-webkit-scrollbar{display:none}
@media(max-width:760px){
  .burger{display:inline-flex;order:3;margin-left:auto}
  .top-actions{order:2}
  .topbar{padding-top:10px;padding-bottom:10px;min-height:60px}
  .nav{order:5;display:none;flex-basis:100%;width:100%;flex-direction:column;align-items:stretch;gap:2px;padding:2px 0 10px}
  .nav.open{display:flex}
  .nav button{width:100%;text-align:left;border-radius:8px;padding:11px 13px}
  .navrow{min-height:0;border-top:0;padding:0}
  .navrow .nav{display:none;padding:0 0 10px;overflow:visible}
  .navrow .nav.open{display:flex}
  .who{display:none}
}
@media(max-width:420px){
  .util{padding:0 9px;font-size:.74rem}
  .brand{font-size:.94rem}
}
@media(max-width:560px){
  .admin-app .topbar{gap:8px;padding-top:10px;padding-bottom:10px}
  .admin-app .brand{flex:1 1 auto}
  .admin-app .burger{order:2;margin-left:auto}
  .admin-app .top-actions{order:3;flex:1 1 100%;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
  .admin-app .top-actions::-webkit-scrollbar{display:none}
  .admin-app .util,.admin-app .online-pill{height:38px;flex:0 0 auto}
}
.foot{padding:28px 0 40px;color:var(--muted);font-size:.8rem;text-align:center;border-top:1px solid var(--line);margin-top:16px}
.admin-app .foot{border-top:1px solid var(--line)}

/* ---------- Struktur halaman ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{margin:0}
.page-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:600px){
  .page-head{align-items:flex-start}
  .page-actions{width:100%}
  .page-actions .btn{flex:1 1 auto}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card + .card{margin-top:18px}
.public-app .card{box-shadow:var(--shadow)}
.admin-app .card{box-shadow:none;border-radius:12px;padding:18px}
.grid{display:grid;gap:18px}
.grid.c2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:stretch}
.grid.c3{grid-template-columns:repeat(auto-fill,minmax(310px,1fr));align-items:stretch}
.grid.single{grid-template-columns:minmax(0,560px)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:none;padding:16px 18px;min-width:0;overflow:hidden}
.stat .n{font-size:clamp(1.28rem,1.05rem + .7vw,1.7rem);font-weight:800;color:var(--primary);line-height:1.12;letter-spacing:-.03em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .l{font-size:.68rem;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.4;margin-top:6px}
.admin-app .dash-stats{grid-template-columns:repeat(6,minmax(172px,1fr));gap:12px}
.admin-app .stat{padding:16px 18px;overflow:visible;border-radius:10px}
.admin-app .stat .n{font-size:clamp(1.3rem,1.1rem + .55vw,1.78rem);white-space:nowrap;overflow:visible;letter-spacing:-.04em}
@media(max-width:1180px){.admin-app .dash-stats{grid-template-columns:repeat(3,minmax(190px,1fr))}}
@media(max-width:680px){.admin-app .dash-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.admin-app .stat{padding:14px}.admin-app .stat .n{font-size:clamp(1.05rem,5vw,1.35rem)}}
@media(max-width:360px){.admin-app .dash-stats{grid-template-columns:1fr}}
.filter-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.result-count{font-size:.82rem;font-weight:600;color:var(--muted);margin:0 0 12px}
.admin-app .result-count{text-transform:uppercase;letter-spacing:.06em;font-size:.72rem}

/* ---------- Tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:10px;background:var(--brand-paint,var(--primary));color:var(--on-brand,#fff);
  padding:10px 18px;font:inherit;font-size:.95rem;font-weight:700;cursor:pointer;text-decoration:none;min-height:44px;line-height:1.2;letter-spacing:.01em;
  transition:background .16s var(--ease),filter .16s var(--ease),transform .12s var(--ease),border-color .16s var(--ease);-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--brand-hover,var(--primary-hover));filter:var(--brand-hover-filter,none);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.99)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.sec{background:var(--secondary-surface);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:color-mix(in srgb,var(--primary) 9%,var(--secondary-surface));transform:translateY(-1px)}
.btn.ok{background:var(--ok);color:#fff} .btn.ok:hover{background:color-mix(in srgb,var(--ok),#111)}
.btn.bad{background:var(--bad);color:#fff} .btn.bad:hover{background:color-mix(in srgb,var(--bad),#111)}
.btn.warn{background:var(--accent);color:#1a1203} .btn.warn:hover{background:color-mix(in srgb,var(--accent),#111)}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--line)}
.btn.ghost:hover{background:color-mix(in srgb,var(--primary) 10%,transparent);border-color:var(--primary);transform:none}
.public-app .btn.ghost{color:var(--ink);border-color:var(--line-strong)}
.public-app .btn.ghost:hover{background:rgba(255,255,255,.06);border-color:var(--muted)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.85rem;border-radius:8px}
.btn.lg{padding:14px 26px;font-size:1.05rem;min-height:56px;border-radius:12px}
.btn.block{width:100%}

/* ---------- Chip ---------- */
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--chip-bg);color:var(--chip-ink);white-space:nowrap;line-height:1.4;letter-spacing:.02em}
.chip.ok{background:var(--okbg);color:var(--ok-ink)}
.chip.bad{background:var(--badbg);color:var(--bad-ink)}
.chip.warn{background:var(--warnbg);color:var(--warn-ink)}
.chip.info{background:var(--infobg);color:var(--info-ink)}

/* ---------- Form ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-weight:600;margin-bottom:6px;font-size:.88rem;letter-spacing:.005em}
.field .hint{font-size:.8rem;color:var(--muted);margin-top:5px;line-height:1.45}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--input-border);border-radius:10px;font:inherit;background:var(--input-bg);color:var(--ink);min-height:44px;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--input-ring)}
textarea{min-height:110px;resize:vertical;line-height:1.55}
input[type=file]{padding:9px;line-height:1.4}
input[type=file]::file-selector-button{background:var(--secondary-surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-right:10px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
input[type=file]::file-selector-button:hover{background:color-mix(in srgb,var(--primary) 10%,var(--secondary-surface))}
input[type=color]{padding:4px;cursor:pointer}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--primary);cursor:pointer}
.row2{display:grid;gap:14px 16px;grid-template-columns:1fr 1fr}
.fields-grid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.field-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.palette-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));margin-bottom:16px}
.palette{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);min-height:0;transition:border-color .16s var(--ease),box-shadow .16s var(--ease),transform .16s var(--ease)}
.palette:hover{border-color:var(--muted);transform:translateY(-1px)}
.palette[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 2px var(--input-ring)}
.palette .swatch{display:block;height:34px;border-radius:6px;margin-bottom:7px;border:1px solid rgba(0,0,0,.12)}
.palette .name{display:block;font-size:.78rem;font-weight:700;line-height:1.2}
.palette .hint{display:block;font-size:.68rem;color:var(--muted);line-height:1.3;margin-top:2px}
.theme-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.theme-preview{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin-top:14px}
.theme-preview-bar{height:62px}
.theme-preview-body{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px}
.theme-preview-body .btn{pointer-events:none;cursor:default}
.form-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.form-actions .end{margin-left:auto}
.form-section{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}
.form-section:first-of-type{margin-top:4px;padding-top:0;border-top:0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.section-head h3,.section-head h2{margin:0}
.peserta{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
.peserta-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.peserta-head h4{margin:0;font-size:.9rem}
.peserta .field:last-child{margin-bottom:0}
.checkout{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.checkout .label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}
.checkout .amount{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.2;transition:color .18s var(--ease)}
.checkout .amount.bump{animation:bump .32s var(--ease-out)}
@keyframes bump{0%{transform:translateY(0)}35%{transform:translateY(-3px)}100%{transform:translateY(0)}}
@media(max-width:560px){
  .checkout{position:sticky;bottom:8px;z-index:5;margin-top:18px;padding:12px 14px;border-top:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 -2px 4px rgba(0,0,0,.08),0 14px 34px -16px rgba(0,0,0,.5)}
  .checkout .amount{font-size:1.24rem}
  .checkout .btn{width:100%}
}
.payinfo{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:.92rem}
.qris-box{display:grid;gap:8px;justify-items:start}
.qris-img{display:block;width:min(260px,100%);padding:10px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.qris-preview{display:block;width:200px;max-width:100%;padding:8px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.size-chart-box{display:grid;gap:8px;justify-items:start;margin:14px 0}
.size-chart{display:block;width:min(320px,100%);padding:10px;border-radius:12px;background:#fff;border:1px solid var(--line)}
@media(max-width:560px){.row2{grid-template-columns:1fr}}

/* ---------- Tabel ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;white-space:nowrap;background:var(--surface-2)}
.tbl tbody tr:nth-child(even){background:var(--row-alt)}
.tbl tbody tr:hover{background:color-mix(in srgb,var(--primary) 7%,transparent)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .mono{font-size:.82rem;white-space:nowrap}
.tbl.mid{min-width:640px}
.tbl.wide{min-width:980px}
.admin-app .tbl th,.admin-app .tbl td{padding:10px 12px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cell-data{max-width:280px;white-space:normal;color:var(--muted)}

/* ---------- Kartu kegiatan ---------- */
.event{overflow:hidden;padding:0;display:flex;flex-direction:column;transition:box-shadow .22s var(--ease),transform .22s var(--ease),border-color .22s var(--ease);border:1px solid var(--line)}
.event:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:color-mix(in srgb,var(--primary) 55%,var(--line))}
.event .poster{position:relative;aspect-ratio:3/2;background:
  radial-gradient(130% 120% at 100% 0%,color-mix(in srgb,var(--accent) 82%,transparent) 0%,transparent 52%),
  linear-gradient(150deg,color-mix(in srgb,var(--primary) 72%,#020617) 0%,var(--primary) 58%,color-mix(in srgb,var(--primary) 78%,#020617) 100%);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:2.5rem;letter-spacing:.08em;overflow:hidden}
.event .poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(2,6,23,.5));pointer-events:none}
.event .poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease-out)}
.event:hover .poster img{transform:scale(1.04)}
.event .poster .poster-badges{position:absolute;left:12px;bottom:12px;z-index:1;display:flex;gap:6px;flex-wrap:wrap}
.event .poster .chip{background:#fff;color:#0b1220;box-shadow:0 1px 3px rgba(2,6,23,.3)}
.event .poster .chip.mute{background:rgba(2,6,23,.78);color:#fff;box-shadow:none}
.event .body{padding:18px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.event .body h3{font-size:1.16rem;line-height:1.3;margin:0;letter-spacing:-.02em}
.event .body .btn{margin-top:auto}
.event-meta{display:grid;gap:6px;font-size:.86rem;color:var(--muted)}
.event-meta .row{display:flex;align-items:center;gap:8px;min-width:0}
.event-meta .row svg{flex:0 0 auto;opacity:.85}
.event-meta .row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-price{font-size:1.02rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}
.event-price .lbl{display:block;font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.event .cta{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.event .cta svg{transition:transform .22s var(--ease-out)}
.event:hover .cta svg{transform:translateX(3px)}
.event-row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.event-row-thumb{width:68px;height:84px;flex:0 0 auto;border-radius:10px;overflow:hidden;background:
  radial-gradient(120% 110% at 100% 0%,color-mix(in srgb,var(--accent) 80%,transparent) 0%,transparent 55%),
  linear-gradient(150deg,color-mix(in srgb,var(--primary) 72%,#020617),var(--primary));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1rem;letter-spacing:.04em}
.event-row-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.event-row-body{flex:1;min-width:190px;display:flex;flex-direction:column;gap:5px}
.event-row-body b{font-size:1.04rem;line-height:1.3}
.event-row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(max-width:560px){.event-row-actions{width:100%}}

/* ---------- Hero halaman kegiatan ---------- */
.hero{display:grid;gap:36px;grid-template-columns:minmax(0,380px) 1fr;align-items:start}
.hero .poster-big{border-radius:var(--radius);overflow:hidden;background:linear-gradient(135deg,var(--primary),var(--accent));border:1px solid var(--line);aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:3rem;letter-spacing:.06em}
.hero .poster-big img{width:100%;height:100%;object-fit:cover;display:block}
.hero h1{margin:.2em 0 .45em}
.public-app .hero h1.display{font-size:clamp(2.8rem,2.2rem + 3vw,4.6rem)}
.fact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;margin:18px 0 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}
.fact .k{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.fact .v{font-weight:600;font-size:.96rem;line-height:1.4}
.video{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:24px}.hero .poster-big{width:100%;max-width:100%;aspect-ratio:4/3}}

/* ---------- Landing publik ---------- */
.home-hero{position:relative;overflow:hidden;border-radius:18px;padding:clamp(28px,4vw,56px);margin-bottom:36px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:32px;align-items:center}
.home-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 65% at 20% 30%,color-mix(in srgb,var(--primary) 12%,transparent) 0%,transparent 62%);pointer-events:none;opacity:.6;animation:hero-glow 8s ease-in-out infinite alternate}
@keyframes hero-glow{0%{opacity:.4;transform:scale(1)}100%{opacity:.7;transform:scale(1.08)}}
.home-hero-copy{position:relative;z-index:1;max-width:40rem}
.home-hero h1{margin:0 0 16px;font-size:clamp(3.2rem,2.4rem + 4vw,5.6rem);color:var(--ink);text-wrap:balance}
.home-hero p{margin:0 0 26px;font-size:1.05rem;line-height:1.6;color:var(--muted);max-width:46ch}
.home-hero-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.home-hero-actions .btn{min-height:48px;padding:12px 22px;transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .18s var(--ease)}
.home-hero-actions .btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px -8px color-mix(in srgb,var(--primary) 45%,transparent)}
.hero-count{font-size:.8rem;font-weight:600;color:var(--muted);padding-left:6px}
.home-hero-art{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-height:280px}
.gate-pass{position:relative;width:min(100%,320px);background:var(--accent-paint,var(--accent));color:#1a1203;border-radius:14px;padding:24px 22px;transform:rotate(-3deg);box-shadow:0 34px 60px -30px rgba(2,6,23,.95),0 2px 0 rgba(0,0,0,.04);transition:transform .24s var(--ease)}
.gate-pass:hover{transform:rotate(-1deg) translateY(-3px)}
.gate-pass::before,.gate-pass::after{content:"";position:absolute;top:58%;width:22px;height:22px;border-radius:50%;background:var(--surface);transform:translateY(-50%)}
.gate-pass::before{left:-11px}
.gate-pass::after{right:-11px}
.gate-pass-top{display:flex;justify-content:space-between;align-items:center;font-size:.64rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px dashed rgba(26,18,3,.4);padding-bottom:12px}
.gate-pass-title{font-family:var(--font-display);font-size:3.8rem;line-height:.9;letter-spacing:.03em;margin:18px 0 8px}
.gate-pass-sub{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.5}
.gate-pass-code{margin-top:26px;border-top:1px dashed rgba(26,18,3,.4);padding-top:14px;font-family:var(--font-mono);font-size:.72rem;font-weight:600;letter-spacing:.06em;display:flex;justify-content:space-between;gap:12px}
.list-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 18px;animation:rise .5s .28s var(--ease-out) both}
.list-head h2{margin:0;font-size:1.55rem;letter-spacing:-.03em}
.list-head .count{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.public-app .list-head{padding-top:4px}
@media(max-width:860px){
  .home-hero{grid-template-columns:1fr;padding:30px 24px}
  .home-hero-art{display:none}
}
@media(max-width:560px){
  .home-hero{padding:26px 20px;border-radius:14px}
  .home-hero p{font-size:.98rem}
  .home-hero-actions .btn{flex:1 1 auto}
}

/* ---------- Pemilih tiket ---------- */
.tpick{position:relative;display:flex;gap:14px;align-items:center;border:1px solid var(--line-strong);border-radius:12px;padding:15px 16px;cursor:pointer;background:var(--surface);margin-bottom:9px;transition:border-color .18s var(--ease),background .18s var(--ease),box-shadow .18s var(--ease)}
.tpick:hover{border-color:var(--muted)}
.tpick.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--surface));box-shadow:0 0 0 1px var(--primary) inset}
.tpick:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.tpick.off{opacity:.55;cursor:not-allowed;box-shadow:none}
.tpick.off:hover{border-color:var(--line-strong)}
.tpick input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.tpick .dot{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;transition:border-color .18s var(--ease)}
.tpick .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary);transform:scale(0);transition:transform .22s var(--ease-out)}
.tpick.sel .dot{border-color:var(--primary)}
.tpick.sel .dot::after{transform:scale(1)}
.tpick .grow{flex:1;min-width:0}
.tpick .grow b{font-size:.98rem;display:block;line-height:1.3}
.tpick .grow .note{font-size:.8rem;color:var(--muted);margin-top:1px}
.tpick .price{font-variant-numeric:tabular-nums;font-size:1.02rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.tpick.sel .price{color:var(--link)}

/* ---------- Tiket (selalu putih, benda cetak) ---------- */
.ticket{border:2px dashed var(--line-strong);border-radius:var(--radius);background:#ffffff;color:#0b1220;padding:20px 16px;text-align:center}
.ticket + .ticket{margin-top:14px}
.ticket h3{margin-bottom:4px;color:#0b1220}
.ticket .muted,.ticket .small.muted,.ticket .muted.small{color:#5b6b82}
.ticket-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.ticket-grid .ticket+.ticket{margin-top:0}
.qrbox{display:inline-block;background:#fff;padding:12px;border-radius:10px;border:1px solid #dfe5ef}
.qrbox img,.qrbox canvas{max-width:100%}
.big-id{font-size:1.6rem;font-weight:800;letter-spacing:.035em;color:var(--primary);font-variant-numeric:tabular-nums}
.receipt-id{padding:14px 0 16px;margin-bottom:4px}
.status-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}

/* ---------- Chart batang ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:210px;padding:10px 4px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
.bar-col{flex:1 1 0;min-width:38px;max-width:96px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar-col .b{width:100%;max-width:56px;background:var(--primary);border-radius:6px 6px 0 0;min-height:3px;transform-origin:bottom;animation:bar-grow .55s var(--ease-out) both;transition:background .16s var(--ease)}
.bar-col:hover .b{background:var(--primary-hover)}
.bar-col .v{font-size:.72rem;font-weight:700;margin-bottom:3px;font-variant-numeric:tabular-nums}
.bar-lbl{display:flex;gap:10px;overflow-x:auto;padding-top:4px}
.bar-lbl span{flex:1 1 0;min-width:38px;max-width:96px;text-align:center;font-size:.68rem;color:var(--muted)}
@media(max-width:560px){
  .bars{gap:4px}
  .bar-col,.bar-lbl span{min-width:0}
}
@keyframes bar-grow{from{transform:scaleY(.04);opacity:.4}to{transform:scaleY(1);opacity:1}}

/* ---------- Gate ---------- */
.gate-screen{max-width:600px;margin:0 auto}
.gate-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.gate-head h1{margin:2px 0 4px;font-size:1.6rem}
.gate-stat{padding:16px 18px}
.gate-stat .l{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.gate-stat b{font-size:1.35rem;font-variant-numeric:tabular-nums}
.gate-res{border-radius:20px;padding:28px 16px;text-align:center;margin:16px 0;border:3px solid var(--line);background:var(--surface);min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gate-res .t{font-size:2.4rem;font-weight:900;letter-spacing:.01em;line-height:1.05}
.gate-res .n{font-size:1.5rem;font-weight:700;margin-top:8px}
.gate-res .d{font-size:1rem;margin-top:6px;max-width:60ch}
.gate-res.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok-ink)}
.gate-res.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad-ink)}
.gate-res.warn{background:var(--warnbg);border-color:var(--warn);color:var(--warn-ink)}
.gate-res.idle{color:var(--muted)}
.prog{height:18px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.prog>div{height:100%;background:var(--primary);transition:width .4s var(--ease)}
#reader{width:100%;max-width:440px;margin:12px auto;border-radius:12px;overflow:hidden}
.tl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.tl:last-child{border-bottom:0}
.event-pick{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);cursor:pointer;padding:18px;margin-bottom:10px;font:inherit;color:var(--ink);background:var(--card);border-radius:var(--radius);box-shadow:none;transition:border-color .2s var(--ease),transform .2s var(--ease)}
.event-pick:hover{border-color:var(--primary);transform:translateY(-1px)}
.event-pick:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- Auth ---------- */
.auth{max-width:420px;margin:6vh auto 0}
.auth .card{padding:28px}
.auth-mark{width:46px;height:46px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.15rem;margin-bottom:14px}
.auth h2{margin-bottom:4px}
.auth .btn{margin-top:4px}

/* ---------- Kartu pesanan ---------- */
.order-grid{grid-auto-rows:1fr;align-items:stretch}
.order-grid .order-card{margin-top:0}
.order-card{display:flex;flex-direction:column;gap:12px;height:100%;min-width:0}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.order-top>div:first-child{min-width:0}
.order-top .chip{flex:0 0 auto;align-self:flex-start}
.order-top .id{font-family:var(--font-mono);font-size:.76rem;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-top .buyer{font-size:1.04rem;font-weight:700;line-height:1.3;margin:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.order-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;align-content:start}
.order-meta .wide{grid-column:1/-1}
.order-meta .k{font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.order-meta .v{font-size:.86rem;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.order-meta .wide .v{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.order-note{font-size:.78rem;color:var(--muted);margin-top:-4px}
.order-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px;min-height:40px;align-items:flex-end}
.order-actions .btn{flex:0 1 auto;min-width:0;max-width:180px;padding-left:12px;padding-right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:760px){
  .order-grid{grid-auto-rows:auto}
